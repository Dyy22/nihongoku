name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Satu deploy pada satu waktu; deploy yang lebih baru menunggu, tidak membatalkan yang sedang jalan.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # site/ sudah ter-build dan di-commit (build.py butuh teks buku di docs/ yang
      # tidak ada di repo). Pastikan hasilnya ada dan tidak memuat teks buku.
      - name: Cek isi site/
        run: |
          test -s site/index.html
          test -d site/audio
          if grep -qE "Kata Pengantar|3A Corporation|Keterangan Tata Bahasa" site/index.html; then
            echo "site/index.html memuat teks buku. Deploy dibatalkan." >&2
            exit 1
          fi

      - name: Migrasi database (D1)
        run: npx wrangler d1 migrations apply nihongoku --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker + aset
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
